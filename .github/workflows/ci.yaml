name: ci
on: pull_request
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: go test -v -covermode=count -json ./... > test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  test-provisioning:
    needs:
      - go-lint
      - go-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        test-case: [ teams ]

    env:
      BATON_LOG_LEVEL: debug

      CONNECTOR_PRINCIPAL: "${{ secrets.CONNECTOR_PRINCIPAL }}"
      BATON_TOKEN: "${{ secrets.BATON_TOKEN }}"

      BATON_CONNECTOR: ./baton-asana

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install baton
        uses: ConductorOne/github-workflows/actions/get-baton@v2
      - name: Build baton-asana
        run: go build ./cmd/baton-asana
      - name: Run tests for ${{ matrix.test-case }}
        run: |
          case "${{ matrix.test-case }}" in
            "teams")
              ./scripts/validate-grant.sh ${{ env.CONNECTOR_PRINCIPAL }} user 'team:1209110572131887:Team Member' 'team:1209110572131887:Team Member:${{ env.CONNECTOR_PRINCIPAL }}'
              ;;
          esac